<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電腦硬體裝修丙級｜監評指定內容表 測驗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#1d2b2a;--mut:#5d6f6d;--line:#d9e3e1;--acc:#0f7d74;--acc2:#e6f4f2;--ok:#1a7f37;--okbg:#e8f6ec;--bad:#c62828;--badbg:#fdecec;--warn:#9a6700;--warnbg:#fff6dd;--mono:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:#0f3d3a;color:#fff}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:220px}
.top h1 small{display:block;font-weight:400;opacity:.75;font-size:12.5px}
.station{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:10px}
.station b{font-family:var(--mono);font-size:20px;letter-spacing:1px;background:#fff;color:#0f3d3a;padding:0 8px;border-radius:6px}
.tbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 11px;font-size:13.5px}
.tbtn:hover{background:rgba(255,255,255,.25)}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 62px)}
.side{border-right:1px solid var(--line);background:#fff;padding:12px 10px;overflow:auto}
.prog{margin:2px 6px 12px;font-size:13px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.nav{list-style:none;margin:0;padding:0}
.nav li button{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;color:var(--ink)}
.nav li button:hover{background:var(--acc2)}
.nav li button.on{background:var(--acc);color:#fff}
.nav .n{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
.nav .on .n{background:#fff;color:var(--acc)}
.nav .done .n{background:var(--ok);color:#fff}
.nav .t{flex:1;font-size:14px}
.nav .os{font-size:10.5px;opacity:.7}
.main{padding:22px 28px 60px;max-width:1040px;width:100%;min-width:0}
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.head .big{width:42px;height:42px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.head h2{margin:0;font-size:22px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--acc2);color:var(--acc);margin-left:4px;font-weight:500;vertical-align:middle}
.tag.lx{background:#fff1e0;color:#b45309}
.passed{margin-left:auto;font-size:13px;color:var(--ok);font-weight:700}
.req{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.lbl{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.5px;margin-bottom:2px}
.req p{margin:0 0 10px}
.specv{overflow-wrap:anywhere;font-size:16px;font-weight:700;color:#0f3d3a;background:#e9f6f3;border-left:4px solid var(--acc);padding:7px 12px;border-radius:6px}
.specv code{font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:-1px}
.tabs button{border:1px solid var(--line);border-bottom:0;background:#eef2f1;padding:8px 18px;border-radius:10px 10px 0 0;color:var(--mut);font-weight:500}
.tabs button.on{background:#fff;color:var(--acc);font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:18px 20px}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 12px 38px}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--acc2);color:var(--acc);font-weight:700;font-size:13px;display:grid;place-items:center}
.sub{font-size:13.5px;font-weight:700;color:var(--acc);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.sub:first-child{margin-top:0}
code,.k{font-family:var(--mono);font-size:13.5px;background:#eef3f2;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.k{background:#fff;border:1px solid #c9d4d2;border-bottom-width:2px;font-family:inherit;font-size:12.5px}
pre.cmd{background:#122;color:#d7f5ee;font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:8px;overflow-x:auto;margin:6px 0;white-space:pre}
.tip{background:var(--warnbg);border:1px solid #f0d78c;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:14px}
.tip b{color:var(--warn)}
.tip ul{margin:4px 0 0;padding-left:20px}
.note{font-size:13px;color:var(--mut)}
.simintro{font-size:14px;color:var(--mut);margin:0 0 12px}
.win{border:1px solid #9aa;border-radius:6px;background:#f0f0f0;box-shadow:0 3px 12px rgba(0,0,0,.08);margin-bottom:14px;overflow:visible;font-family:'Segoe UI','Noto Sans TC',sans-serif;font-size:14px}
.win .tt{background:#fff;padding:6px 10px;font-size:13px;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:8px;border-radius:6px 6px 0 0}
.win .tt::after{content:'✕';margin-left:auto;color:#666}
.win .bd{padding:12px 14px}
.gn{border:1px solid #ccc;border-radius:12px;background:#fafafa;margin-bottom:14px;overflow:hidden;font-family:Ubuntu,'Noto Sans TC',sans-serif;font-size:14px}
.gn .tt{background:#ebebeb;padding:7px 12px;font-weight:700;font-size:13px;text-align:center}
.gn .bd{padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.row label.w{width:150px;flex:none}
.row input[type=text],.row input[type=number],.row select{padding:4px 7px;border:1px solid #aab;border-radius:4px;background:#fff;min-width:0}
.mono{font-family:var(--mono)}
.btn{background:#e1e1e1;border:1px solid #adadad;padding:3px 14px;border-radius:3px;font-size:13.5px}
.btn:hover{background:#e5f1fb;border-color:#0078d7}
.btn.pri{background:#0078d7;color:#fff;border-color:#0067b8}
table.dk{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
table.dk th,table.dk td{border-bottom:1px solid #e3e3e3;padding:5px 8px;text-align:left}
table.dk th{background:#f7f7f7;font-weight:500}
table.dk tr.sel td{background:#cce8ff}
table.dk tbody tr{cursor:pointer}
.checkbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cbtn{border:0;border-radius:8px;padding:8px 18px;font-weight:700}
.cbtn.go{background:var(--acc);color:#fff}
.cbtn.go:hover{background:#0b6159}
.cbtn.ghost{background:#eef2f1;color:var(--ink)}
.result{margin-top:12px;border-radius:10px;padding:10px 14px;font-size:14px;display:none}
.result.ok{display:block;background:var(--okbg);border:1px solid #9fd5ae}
.result.bad{display:block;background:var(--badbg);border:1px solid #f1b1b1}
.result ul{margin:4px 0 0;padding-left:20px;list-style:none}
.result li.y{color:var(--ok)}.result li.n{color:var(--bad)}.result li.w{color:var(--warn)}
.term{background:#0c0c0c;color:#ccc;font-family:var(--mono);font-size:13px;border-radius:6px;padding:8px 10px;height:300px;display:flex;flex-direction:column;cursor:text}
.term.lx{background:#300a24;color:#eee}
.tout{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-all}
.tin{display:flex;white-space:pre}
.tin input{flex:1;background:transparent;border:0;outline:0;color:inherit;font:inherit;padding:0;min-width:40px}
.wall{display:inline-flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent;border-radius:8px;padding:3px;background:none;font-size:12px}
.wall i{display:block;width:74px;height:46px;border-radius:5px}
.wall.on{border-color:#e95420}
.lst{background:#fff;border:1px solid #aaa;height:150px;overflow:auto;min-width:200px;flex:1}
.lst div{padding:2px 8px;cursor:pointer;white-space:nowrap}
.lst div.sel{background:#0078d7;color:#fff}
.dlg{background:#fff;border:1px solid #0078d7;padding:10px 12px;margin:10px 0;border-radius:4px;font-size:13.5px}
.kb{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #ddd;padding:6px 10px;margin:4px 0 4px 20px;border-radius:4px}
.kb span{flex:1}
.lang{font-weight:700;margin-top:8px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;background:#fff;border:1px solid #ccc;padding:8px;min-height:120px}
.files div{padding:6px;border-radius:3px;text-align:center;font-size:12.5px;cursor:default;word-break:break-all;user-select:none}
.files div .ic{font-size:26px;display:block}
.files div.sel{background:#cce8ff}
.ctx{position:absolute;background:#f2f2f2;border:1px solid #999;box-shadow:2px 2px 6px rgba(0,0,0,.25);font-size:13px;z-index:20;min-width:190px}
.ctx div{padding:5px 22px;cursor:pointer}
.ctx div:hover{background:#cce8ff}
.ctx .dis{color:#999}
.ctx hr{margin:2px 0;border:0;border-top:1px solid #ccc}
.preview{background:#fff;border:1px solid #ccc;min-height:90px;padding:10px;color:#000;font-family:'Times New Roman','PMingLiU',serif;font-size:16px}
textarea.code{width:100%;height:170px;font-family:var(--mono);font-size:13px;border:1px solid #aaa;padding:8px;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:50;overflow:auto}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:20px 22px}
.modal h3{margin:0 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:12px 0}
.grid2 label{font-size:13px;color:var(--mut);display:flex;flex-direction:column}
.grid2 input,.grid2 select{padding:5px 8px;border:1px solid #bbb;border-radius:6px;color:var(--ink);font-size:14px}
@media(max-width:800px){.wrap{grid-template-columns:minmax(0,1fr)}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto;gap:4px}.nav li button{flex-direction:column;gap:2px;width:auto;min-width:70px}.nav .t{font-size:11.5px;text-align:center}.nav .os{display:none}.main{padding:16px 12px 50px}.grid2{grid-template-columns:1fr}.row label.w{width:auto}}

/* 工作排程器 */
.ts{position:relative;font-family:'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif;font-size:13px;background:#fff;border:1px solid #8a8a8a;box-shadow:0 4px 16px rgba(0,0,0,.12);margin-bottom:10px}
.ts .tbar{padding:6px 10px;border-bottom:1px solid #e3e3e3;display:flex}
.ts .menu{padding:2px 6px;border-bottom:1px solid #e3e3e3;font-size:12.5px}.ts .menu span{padding:0 8px}
.ts .tsb{display:grid;grid-template-columns:170px 1fr 180px;min-height:300px}
.ts .tree{border-right:1px solid #ddd;padding:6px 4px;font-size:12.5px}.ts .tree div{padding:2px 4px;white-space:nowrap}.ts .tree .sel{background:#cce8ff}
.ts .center{min-width:0;display:flex;flex-direction:column}.ts .tlw{overflow:auto;max-height:220px}
.ts table.tl{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
.ts table.tl th{background:#fff;border-right:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;text-align:left;font-weight:400;padding:3px 6px;color:#333;position:sticky;top:0}
.ts table.tl td{padding:3px 6px;border-bottom:1px solid #f3f3f3}.ts table.tl tr{cursor:default}.ts table.tl tr.sel td{background:#cce8ff}
.ts .detb{border-top:1px solid #ddd;padding:8px 10px;font-size:12.5px;background:#fafafa;line-height:1.8}
.ts .acts{border-left:1px solid #ddd;background:#fff;font-size:12.5px}
.ts .acts h4{margin:0;padding:4px 8px;font-size:12.5px;font-weight:400;border-bottom:1px solid #ddd}
.ts .acts .ah{background:#dfe9f5;padding:3px 8px;font-weight:700}
.ts .acts div[data-a]{padding:3px 10px 3px 14px;cursor:pointer;color:#0b3d91}.ts .acts div[data-a]:hover{background:#e5f1fb}
.ts .taskbar{background:#1f2430;color:#fff;text-align:right;padding:3px 12px;font-size:11.5px;line-height:1.35;min-height:34px}
.mcover{position:absolute;inset:0;background:rgba(255,255,255,.35);z-index:9}
.wz{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:min(640px,96%);background:#fff;border:1px solid #2b79d8;box-shadow:0 10px 36px rgba(0,0,0,.35);z-index:10}
.wz .wt{padding:6px 10px;display:flex;font-size:12.5px}
.wz .wh{padding:6px 14px 12px;font-size:17px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #e3e3e3}
.wz .wb{display:grid;grid-template-columns:150px 1fr;min-height:250px;background:#f0f0f0}
.wz .ws{padding:12px 0 12px 10px;font-size:12.5px}.wz .ws div{padding:3px 8px;color:#333}.wz .ws .cur{font-weight:700;background:#fff}
.wz .wc{padding:14px 16px;background:#fff}
.wz .wf{display:flex;justify-content:flex-end;gap:6px;padding:10px;border-top:1px solid #ddd;background:#f0f0f0}
.wz label.w2{width:150px;flex:none}.wz input[type=text],.wz textarea{border:1px solid #7a7a7a;padding:3px 5px;border-radius:0;font-size:13px}
.wz .btn:disabled{opacity:.45}
.sumt td{padding:2px 8px 2px 0;vertical-align:top}.sumt td:first-child{white-space:nowrap;width:80px}
.brl{background:#fff;border:1px solid #aaa;margin:4px 0;max-width:340px}.brl div{padding:2px 8px;cursor:pointer}.brl div[data-pk]:hover{background:#cce8ff}
.msgbox{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fff;border:1px solid #2b79d8;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:12;width:min(400px,92%)}
.msgbox .mt{padding:6px 10px;font-size:12.5px}.msgbox .mc{padding:10px 18px 16px;font-size:13.5px;word-break:break-all}.msgbox .mf{background:#f0f0f0;padding:10px;display:flex;justify-content:flex-end;gap:6px}
.dtree{background:#fff;border:1px solid #ccc;padding:6px;font-size:13.5px;min-height:70px}.dtree .di{cursor:pointer;padding:1px 4px}.dtree .di.sel{background:#cce8ff}
/* 考場下載網站 */
.brwwrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;padding:14px}
.brw{position:relative;margin:auto;width:100%;max-width:1000px;height:100%;max-height:760px;background:#fff;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.brw .bt{background:#dee1e6;display:flex;align-items:flex-end;gap:8px;padding:8px 10px 0}
.brw .tabt{background:#fff;padding:6px 14px;border-radius:8px 8px 0 0;font-size:12.5px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.brw .acover{position:absolute;inset:0;background:rgba(0,0,0,.25)}

.brw .dlb{position:absolute;right:14px;top:96px;background:#fff;border:1px solid #ccc;border-radius:10px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:13px}
@media(max-width:800px){.ts .tsb{grid-template-columns:1fr}.ts .tree{display:none}.ts .acts{border-left:0;border-top:1px solid #ddd}

.brw .h1{font-size:20px}.brw b.th{font-size:20px}.brw td.lab b{font-size:16px}.brw td.sc a{font-size:14px}.brw td.note1{font-size:15px}.brw table.st{width:100%}}
</style>

<body>
<div class="top">
  <h1>電腦硬體裝修丙級｜監評指定內容表 測驗<small id="who">測驗模式・不提供解答</small></h1>
  <div class="station">工作崗位號碼 XX = <b id="xx">--</b></div>
  <div class="station">⏱ <span id="tlabel">經過</span> <b id="timer">00:00:00</b></div>
  <button class="tbtn" id="site">🌐 考場下載網站</button>
  <button class="tbtn" id="submit" style="background:#e9a23b;border-color:#e9a23b;color:#1d2b2a;font-weight:700">📤 交卷</button>
  <button class="tbtn" id="restart">↺ 重新開始</button>
</div>
<div class="wrap">
  <aside class="side">
    <div class="prog">已通過 <b id="pc">0</b> / 15 項<div class="bar"><i id="pb" style="width:0"></i></div></div>
    <ul class="nav" id="nav"></ul>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="modal" id="startm"><div class="box" style="max-width:480px;margin-top:5vh">
  <h3>電腦硬體裝修丙級｜監評指定內容表 測驗</h3>
  <div class="note">輸入資料後按「開始測驗」。測驗中指定值不可修改；每題可按「✔ 檢查」，只顯示通過／未通過，系統會記錄檢查次數。完成後按右上「交卷」。</div>
  <div class="grid2" style="grid-template-columns:1fr">
    <label>姓名<input id="f_name" maxlength="20" autocomplete="off"></label>
    <label>座號／學號<input id="f_sid" maxlength="20" autocomplete="off"></label>

  </div>

  <div id="f_err" style="color:var(--bad);font-size:13.5px;min-height:1.4em"></div>
  <div style="display:flex;justify-content:flex-end"><button class="cbtn go" id="f_go">開始測驗</button></div>
</div></div>

<script>
const DEF={sysGB:80,dataGB:30,vmRAM:2,winName:'cXX',linName:'vXX',winIP:'static',linIP:'dhcp',ipPrefix:'192.168.240.1',

saverMin:3,ime:'微軟倉頡',font:'漢鼎繁勘亭',office:['word'],ftpIP:'192.168.240.200',ftpPwd:'go8868@TW',

function checkBar(box,fn){
  const id=cur;
  const bar=document.createElement('div');bar.className='checkbar';
  bar.innerHTML=`<button class="cbtn go">✔ 檢查</button><button class="cbtn ghost">↺ 重做</button><span class="note" style="align-self:center;margin-left:auto"></span>`;
  const res=document.createElement('div');res.className='result';
  box.append(bar,res);
  const cnt=bar.children[2],upd=()=>{const r=EX&&EX.items[id];cnt.textContent=`本題已檢查 ${r?r.attempts:0} 次`};
  bar.children[0].onclick=()=>{
    if(!EX||EX.submittedAt)return;
    let ok=false;try{const r=fn();ok=Array.isArray(r)&&r.length>0&&r.every(Boolean)}catch(e){console.error(e)}
    const it=rec(id);it.attempts++;if(ok&&!it.passed){it.passed=true;it.firstPassSec=elapsedSec()}saveEx();
    res.className='result '+(ok?'ok':'bad');res.innerHTML=ok?'<b>✔ 通過</b>':'<b>✘ 未通過</b>';
    renderNav();const p=$('#passtag');if(p&&isP(id))p.textContent='✔ 已通過';upd();
  };

}
function makeTerm(el,{prompt,onLine,banner,lx}){
  el.innerHTML=`<div class="term${lx?' lx':''}"><div class="tout"></div><div class="tin"><span class="tp"></span><input spellcheck="false" autocomplete="off" autocapitalize="off"></div></div>`;
  const out=$('.tout',el),inp=$('input',el),tp=$('.tp',el);let pending=null,hist=[],hi=0;
  const T={prompt,
    print(s){const d=document.createElement('div');d.textContent=s;out.appendChild(d);out.scrollTop=out.scrollHeight},
    setPrompt(p){T.prompt=p;if(!pending)tp.textContent=p},
    ask(q,masked,cb){pending={q,masked,cb};tp.textContent=q;inp.type=masked?'password':'text'},
    clear(){out.innerHTML=''}};
  tp.textContent=prompt;if(banner)T.print(banner);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const v=inp.value;inp.value='';
      if(pending){const p=pending;pending=null;inp.type='text';T.print(p.q+(p.masked?'':v));tp.textContent=T.prompt;p.cb(v)}
      else{T.print(T.prompt+v);if(v.trim())hist.push(v);hi=hist.length;onLine(v.trim(),T)}}
    else if(e.key==='ArrowUp'&&!pending){if(hi>0){hi--;inp.value=hist[hi]}e.preventDefault()}
    else if(e.key==='ArrowDown'&&!pending){if(hi<hist.length-1){hi++;inp.value=hist[hi]}else{hi=hist.length;inp.value=''}e.preventDefault()}
  });
  $('.term',el).addEventListener('click',()=>inp.focus());
  return T;
}

/* ---------- 測驗：狀態、計時、交卷 ---------- */
function saveEx(){store.set(EXKEY,EX)}
function rec(id){if(!EX.items[id])EX.items[id]={passed:false,attempts:0,firstPassSec:null};return EX.items[id]}
function elapsedSec(){return Math.max(0,Math.round((Date.now()-Date.parse(EX.startedAt))/1000))}
function deadline(){return EX&&EX.min>0?Date.parse(EX.startedAt)+EX.min*60000:0}
const hms=s=>{s=Math.max(0,Math.floor(s));return [s/3600,s/60%60,s%60].map(x=>String(Math.floor(x)).padStart(2,'0')).join(':')};
function tick(){
  if(!EX){$('#timer').textContent='00:00:00';return}
  const end=EX.submittedAt?Date.parse(EX.submittedAt):Date.now();
  if(EX.min>0){const left=(deadline()-end)/1000;$('#tlabel').textContent='剩餘';$('#timer').textContent=hms(left);
    if(!EX.submittedAt&&left<=0)doSubmit(true)}
  else{$('#tlabel').textContent='經過';$('#timer').textContent=hms((end-Date.parse(EX.startedAt))/1000)}
}
function buildResult(){
  const items={};let n=0;
  for(let i=1;i<=15;i++){const r=EX.items[i]||{};const p=!!r.passed;if(p)n++;
    items[String(i)]={passed:p,attempts:Math.max(0,r.attempts|0),firstPassSec:p&&typeof r.firstPassSec==='number'?r.firstPassSec:null}}
  return {v:1,exam:'hdfix3',name:EX.name,sid:EX.sid,seat:EX.seat,startedAt:EX.startedAt,submittedAt:EX.submittedAt,
    durationSec:Math.max(0,Math.round((Date.parse(EX.submittedAt)-Date.parse(EX.startedAt))/1000)),score:Math.round(n/15*100),items};
}
function doSubmit(auto){
  if(!EX||EX.submittedAt)return;
  let t=Date.now();const dl=deadline();if(dl&&t>dl)t=dl;
  EX.submittedAt=new Date(t).toISOString();EX.auto=!!auto;saveEx();
  $$('.brwwrap').forEach(x=>x.remove());simCache={};
  updTop();renderNav();renderMain();tick();window.scrollTo(0,0);
  if(QF)qfUpload();
  if(auto)setTimeout(()=>alert('時間到，已自動交卷。'),50);
}
const safeName=s=>String(s).replace(/[\\/:*?"<>|\s]+/g,'_')||'_';
function resultCode(){return 'HDFIX3:'+b64enc(JSON.stringify(buildResult()))}
function renderResult(){
  const r=buildResult(),n=Object.values(r.items).filter(x=>x.passed).length;
  $('#main').innerHTML=`<div class="head"><div class="big">✔</div><div><h2>已交卷${EX.auto?'（時間到自動交卷）':''}</h2></div></div>
  <div class="req"><div class="lbl">應檢人</div><p>${esc(r.name)}　座號／學號 ${esc(r.sid)}　工作崗位 ${esc(r.seat)}</p>
  <div class="lbl">成績</div><div class="specv" style="font-size:22px">${r.score} 分　<span style="font-size:15px">（通過 ${n} / 15 題，作答時間 ${hms(r.durationSec)}）</span></div></div>
  <div class="panel" style="border-radius:12px">
  ${QF?'<div class="result" id="qfup" style="margin:0 0 12px"></div>':''}
  <table class="dk"><thead><tr><th>題</th><th>項目</th><th>結果</th><th>檢查次數</th><th>首次通過</th></tr></thead><tbody>
  ${ITEMS.map(it=>{const x=r.items[it.id];return `<tr><td>${it.id}</td><td>${it.t}</td><td style="color:${x.passed?'var(--ok)':'var(--bad)'};font-weight:700">${x.passed?'✔ 通過':'✘ 未通過'}</td><td>${x.attempts}</td><td>${x.firstPassSec==null?'—':hms(x.firstPassSec)}</td></tr>`}).join('')}
  </tbody></table>
  <div class="checkbar"><button class="cbtn go" id="dljson">⬇ 下載成績檔</button><button class="cbtn go" id="cpcode">📋 複製成績碼</button></div>
  <div class="note" style="margin-top:10px">把「成績檔」或「成績碼」交給老師（例如貼到 Google Classroom）。成績碼：</div>
  <textarea class="code" id="codebox" readonly style="height:90px">${esc(resultCode())}</textarea>
  <div class="result" id="cpmsg"></div></div>`;
  $('#dljson').onclick=()=>{const b=new Blob([JSON.stringify(buildResult(),null,2)],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=`hdfix3_${safeName(EX.sid)}_${safeName(EX.name)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  $('#cpcode').onclick=()=>{const code=resultCode(),m=$('#cpmsg'),ok=()=>{m.className='result ok';m.textContent='✔ 已複製成績碼，請貼給老師。'};
    const fb=()=>{const t=$('#codebox');t.focus();t.select();let s=false;try{s=document.execCommand('copy')}catch(e){}if(s)ok();else{m.className='result bad';m.textContent='無法自動複製，請手動全選上方文字後複製。'}};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(code).then(ok,fb);else fb()};
  qfStatus();
}
function updTop(){
  $('#who').textContent=EX?`${EX.name}（${EX.sid}）・${EX.submittedAt?'已交卷':'測驗中'}`:'測驗模式・不提供解答';
  $('#submit').style.display=EX&&!EX.submittedAt?'':'none';
  $('#site').style.display=EX&&!EX.submittedAt?'':'none';
  $('#restart').style.display=EX?'':'none';
}
function showStart(){
  $('#f_xx').value=rndXX();
  const info=[];
  if(QF){info.push(`QuizFlow 連線測驗「${QF.title}」：本卷指定值由老師設定，交卷後成績會自動上傳給老師。`);
    const m=store.get(QF_STU);if(m&&typeof m==='object'){if(m.name)$('#f_name').value=m.name;if(m.sid)$('#f_sid').value=m.sid;if(/^\d{2}$/.test(m.seat||''))$('#f_xx').value=m.seat}}
  else if(Q.get('spec'))info.push(Object.keys(URLSPEC).length?'本卷指定值由老師設定。':'⚠ 老師提供的指定值參數無法讀取，已使用預設值（表 A）。');
  if(MIN>0)info.push(`限時 ${MIN} 分鐘，時間到自動交卷。`);
  $('#f_info').textContent=info.join(' ');
  $('#startm').classList.add('show');$('#f_name').focus();
}
$('#f_rnd').onclick=()=>{$('#f_xx').value=rndXX()};
$('#f_go').onclick=()=>{
  const name=$('#f_name').value.trim(),sid=$('#f_sid').value.trim(),xv=$('#f_xx').value.trim(),xn=parseInt(xv,10),err=$('#f_err');
  if(!name)return err.textContent='請輸入姓名';
  if(!sid)return err.textContent='請輸入座號／學號';
  if(!/^\d{1,2}$/.test(xv)||xn<1||xn>24)return err.textContent='工作崗位號碼需為 01–24';
  XX=String(xn).padStart(2,'0');
  EX={v:1,name,sid,seat:XX,startedAt:new Date().toISOString(),submittedAt:null,min:MIN,spec:S,items:{}};saveEx();
  if(QF)store.set(QF_STU,{name,sid,seat:XX});
  $('#startm').classList.remove('show');simCache={};resetShared();cur=1;updTop();renderNav();renderMain();tick();
};
$('#submit').onclick=()=>{if(!EX||EX.submittedAt)return;const n=ITEMS.filter(it=>isP(it.id)).length;
  if(confirm(`確定要交卷嗎？交卷後就不能再作答。\n目前通過 ${n} / 15 題。`))doSubmit(false)};
$('#restart').onclick=()=>{if(!confirm(EX&&EX.submittedAt?'重新開始會清除這次的成績，確定嗎？（請先確認已下載或複製成績）':'重新開始會清除所有作答紀錄，確定嗎？'))return;
  try{localStorage.removeItem(EXKEY)}catch(e){}location.reload()};
$('#site').onclick=()=>{if(EX&&!EX.submittedAt)openSite()};

/* ---------- QuizFlow 連線模式 ---------- */
function qfBanner(html,kind){let b=$('#qfbar');if(!b){b=document.createElement('div');b.id='qfbar';$('.top').after(b)}
  b.style.cssText='padding:8px 20px;font-size:13.5px;border-bottom:1px solid var(--line);'+(kind==='bad'?'background:var(--badbg);color:var(--bad)':'background:var(--acc2);color:var(--ink)');b.innerHTML=html}
let qfBusy=false;
async function qfUpload(){
  if(!QF||!EX||!EX.submittedAt||qfBusy)return;
  qfBusy=true;EX.qf={pending:true};qfStatus();
  try{
    const r=await fetch(`/api/sim/${encodeURIComponent(QF.code)}/submit`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(buildResult())});
    let j=null;try{j=await r.json()}catch(e){}
    if(!r.ok||!j||!j.ok)throw new Error((j&&(j.error||j.message))||('HTTP '+r.status));
    EX.qf={ok:true,score:j.score,attemptNo:j.attemptNo};
  }catch(e){EX.qf={ok:false,error:String(e&&e.message||e)}}
  qfBusy=false;saveEx();qfStatus();
}
function qfStatus(){
  const el=$('#qfup');if(!el||!QF||!EX)return;const s=EX.qf||{};
  if(s.pending){el.className='result ok';el.innerHTML='⏳ 正在上傳成績到老師的 QuizFlow…';return}
  if(s.ok){el.className='result ok';el.innerHTML=`<b>✅ 已上傳到老師的 QuizFlow</b>　${typeof s.score==='number'?esc(s.score)+' 分':''}${s.attemptNo?'・第 '+esc(s.attemptNo)+' 次交卷':''}`;return}
  el.className='result bad';
  el.innerHTML=`<b>⚠ 成績上傳失敗</b>（${esc(s.error||'未知錯誤')}）<br>請按「🔁 重新上傳」，或用下方「下載成績檔」／「複製成績碼」交給老師。<div style="margin-top:8px"><button class="cbtn go" id="qfretry">🔁 重新上傳</button></div>`;
  $('#qfretry').onclick=qfUpload;
}
async function qfInit(){
  $('#main').innerHTML='<div class="req">正在連線到 QuizFlow，讀取老師設定的測驗…</div>';
  try{
    const r=await fetch(`/api/sim/${encodeURIComponent(QF.code)}`,{headers:{Accept:'application/json'}});
    let j=null;try{j=await r.json()}catch(e){}
    if(!r.ok||!j||typeof j!=='object')throw new Error((j&&(j.error||j.message))||('HTTP '+r.status));
    QF.title=String(j.title||'');QF.timeLimitMin=Math.max(0,+j.timeLimitMin||0);
    URLSPEC=cleanSpec(j.spec);MIN=QF.timeLimitMin;
    S=Object.assign({},DEF,EX&&EX.spec?EX.spec:URLSPEC);
    qfBanner(`🔗 QuizFlow 連線測驗：<b>${esc(QF.title||'實作模擬')}</b>　指定值由老師設定${MIN>0?`・限時 ${MIN} 分鐘`:''}・交卷後成績自動上傳`);
  }catch(e){
    console.warn('QuizFlow 連線失敗，改用離線模式',e);
    QF=null;URLSPEC=urlSpec();MIN=Math.max(0,parseFloat(Q.get('min'))||0);
    S=Object.assign({},DEF,EX&&EX.spec?EX.spec:URLSPEC);
    qfBanner(`⚠ 無法連線到 QuizFlow（${esc(e&&e.message||e)}），已改用離線模式：成績不會自動上傳，交卷後請下載成績檔或複製成績碼交給老師。`,'bad');
  }
  boot();
}
function boot(){
  resetShared();updTop();renderNav();renderMain();tick();setInterval(tick,1000);
  if(!EX)showStart();
  else if(QF&&EX.submittedAt&&!(EX.qf&&EX.qf.ok))qfUpload(); // 交卷後重新整理／上次上傳中斷 → 補傳
}
if(QF)qfInit();else boot();
</script>
</body>
