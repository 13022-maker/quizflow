<style>

  .opt img{max-height:64px;width:auto;max-width:150px;background:#fff}

  .kbdhint{margin-top:14px;text-align:center;font-size:12px;color:var(--hint)}

  @media (max-width:480px){

<script>
(function(){
  "use strict";
  function esc(s){return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  /* ---------- 題目資料 ----------
     來源:勞動部技能檢定「12000 電腦硬體裝修 丙級」學科題庫工作項目01:電腦、電子及
     電機機械識圖,共 49 題。id 直接對應官方題號(q1~q49),方便日後回頭核對原始題本。
     正解(correctIndex,0-based)取自題本本身標示的官方答案,不是憑內容判斷得出。

     image 欄位三種用法:
     1. 不寫(預設)—— 自動依 id 去 images/ 資料夾嘗試 <id>.jpg/.jpeg/.png/.svg/.webp
     2. 內嵌 SVG 或手寫 <img> 字串 —— 手動指定,不走自動載入
     3. image:false —— 明確標記此題本來就沒有圖,不嘗試自動載入(省掉無謂的 404)

     options 陣列的每一項通常是文字字串;若某題的選項本身就是圖(例如三視圖辨識),
     可以改成 {img:'images/xxx.png', alt:'說明文字'} 物件,畫面會顯示縮圖而非文字。
  ---------------------------------------------------------------------------- */
  var GROUP='工作項目01:電腦、電子及電機機械識圖';

  var QUESTIONS=[
    { id:'q1', groupLabel:GROUP,
      question:'下圖所示之D型正反器,Clock採何種準位觸發?',
      options:['正電位觸發動作','負電位觸發動作','正緣觸發動作','負緣觸發動作'],
      correctIndex:2,
      explanation:'CK 輸入端只畫三角形、沒有反相小圓圈,依慣例代表<b>正緣觸發</b>;若三角形前多一個小圓圈,才是負緣觸發。'
    },
    { id:'q2', groupLabel:GROUP,
      question:'下圖所示符號用來表示?',
      options:['多工器','編碼器','解多工器','解碼器'],
      correctIndex:2,
      explanation:'圖中 1 個輸入 A 搭配選擇線 S1S0、展開成 Y0~Y3 多個輸出,是「一對多」的<b>解多工器(Demultiplexer)</b>接線方式;多工器則相反,是多個輸入選一個輸出。'
    },
    { id:'q3', groupLabel:GROUP,
      question:'下圖之右側視圖為?(選項本身即為視圖)',
      options:[
        {img:'images/q3-opt1.png', alt:'選項①右側視圖'},
        {img:'images/q3-opt2.png', alt:'選項②右側視圖'},
        {img:'images/q3-opt3.png', alt:'選項③右側視圖'},
        {img:'images/q3-opt4.png', alt:'選項④右側視圖'}
      ],
      correctIndex:3,
      explanation:'三視圖判讀要領:前視圖看正面輪廓、頂視圖看由上往下看的輪廓、右側視圖看由右方看過去的輪廓,再對照立體圖上各面的凹凸位置逐一排除。這題正解為官方題本標示的第 4 個圖,建議自行動手畫一次立體圖驗證。'
    },
    { id:'q4', groupLabel:GROUP,
      question:'下圖所示邏輯符號功能相當於?',
      options:['OR','AND','XOR','XNOR'],
      correctIndex:2,
      explanation:'XOR(互斥或)閘常見的等效實作之一,就是用 OR / NOR 之類的基本邏輯閘組合出來;圖中這種「OR 閘 + 兩個 NOR 閘再接一個 NOR」的接法是教科書上常見的 XOR 等效電路。'
    },
    { id:'q5', groupLabel:GROUP,
      question:'下圖 IC 符號第一支接腳位置在?',
      options:['Ａ腳','Ｂ腳','Ｃ腳','Ｄ腳'],
      correctIndex:1,
      explanation:'DIP 封裝 IC 頂視圖上,缺口(或圓點)所在的那一側、缺口下方的接腳即為第 1 腳,再以逆時針方向依序編號;圖中缺口在左側,對應下方的 B 腳。'
    },
    { id:'q6', groupLabel:GROUP,
      question:'下圖所示符號用來表示?',
      options:['直流電源','直流安培計','交流安培計','瓦特計'],
      correctIndex:0,
      explanation:'一長一短兩條平行線是電池/直流電源的標準符號,長線為正極、短線為負極。'
    },
    { id:'q7', groupLabel:GROUP,
      question:'下圖所示符號用來表示?',
      options:['安培計','伏特計','電流源','電壓源'],
      correctIndex:2,
      explanation:'圓圈內畫箭頭是電流源的標準符號,箭頭方向表示電流流向;電壓源則是圓圈內畫加減號或波浪線。'
    },
    { id:'q8', groupLabel:GROUP,
      question:'如圖輸出等於何種邏輯閘?',
      options:['AND','OR','NOR','NAND'],
      correctIndex:2,
      explanation:'CMOS 邏輯閘裡,上拉網路(PMOS)串聯、下拉網路(NMOS)並聯的組合是 NOR 閘的典型電晶體級實作(NAND 則相反:PMOS 並聯、NMOS 串聯)。'
    },
    { id:'q9', groupLabel:GROUP,
      question:'如下圖所示符號中,有一三角形表示CK為?',
      options:['邊緣觸發','準位觸發','延遲觸發','清除控制'],
      correctIndex:0,
      explanation:'CK 輸入端只要畫成三角形(不管有沒有小圓圈),就代表這是<b>邊緣觸發(edge-triggered)</b>元件;沒有三角形、直接畫方塊輸入的才是準位觸發。'
    },
    { id:'q10', groupLabel:GROUP,
      question:'如下圖所示,在IC資料手冊上其表示CK為?',
      options:['正緣觸發','負緣觸發','正準位觸發','負準位觸發'],
      correctIndex:1,
      explanation:'三角形前面多畫一個小圓圈(反相符號),代表觸發動作在訊號「由高轉低」的那一瞬間發生,也就是<b>負緣觸發</b>;沒有小圓圈則是正緣觸發。'
    },
    { id:'q11', groupLabel:GROUP, image:false,
      question:'前視圖不能用來表示物件前部的?',
      options:['形狀','高度','寬度','亮度'],
      correctIndex:3,
      explanation:'工程圖(前視圖/頂視圖/側視圖)呈現的是幾何形狀與尺寸,亮度屬於材質/光影表現,不是視圖要傳達的資訊。'
    },
    { id:'q12', groupLabel:GROUP, image:false,
      question:'當在繪製電路圖時,習慣上是將輸入訊號置於?',
      options:['右方','前方','上方','左方'],
      correctIndex:3,
      explanation:'電路圖慣例是訊號由左至右流動,所以輸入畫在左邊、輸出畫在右邊,跟中文由左到右的閱讀習慣一致。'
    },
    { id:'q13', groupLabel:GROUP, image:false,
      question:'在我國的國家標準(CNS)中,以何種單位來表達繪製元件的外型尺寸?',
      options:['英制','公分','公制','台尺'],
      correctIndex:2,
      explanation:'CNS(中華民國國家標準)採用公制(SI 制)作為工程製圖的標註單位。'
    },
    { id:'q14', groupLabel:GROUP, image:false,
      question:'將鉛筆之筆芯兩側削薄成楔形者是專門用來繪製?',
      options:['直線','曲線','圓形','截斷線'],
      correctIndex:0,
      explanation:'楔形筆芯兩側平整、線寬穩定,方便沿著直尺畫出粗細一致的直線;曲線類則多用圓錐形筆芯。'
    },
    { id:'q15', groupLabel:GROUP, image:false,
      question:'電腦繪圖所儲存的檔案格式,哪一種不失真?',
      options:['BMP','GIF','JPG','TIF'],
      correctIndex:0,
      explanation:'BMP 是無壓縮點陣格式,不會失真;JPG 是破壞性壓縮會失真,GIF 只支援 256 色,TIF 雖可無失真但選項情境下官方標示正解為 BMP。'
    },
    { id:'q16', groupLabel:GROUP, image:false,
      question:'下列何者不具備主動管理系統記憶體資源的能力?',
      options:['EMM386','HIMEM','QEMM','MEM'],
      correctIndex:3,
      explanation:'MEM 是 DOS 下用來「查看」記憶體使用狀況的指令,本身不會主動管理/配置記憶體;EMM386、HIMEM.SYS、QEMM 都是實際的記憶體管理程式。'
    },
    { id:'q17', groupLabel:GROUP, image:false,
      question:'下列有關示波器面板的「CAL」(Calibration)之敘述,何者正確?',
      options:['輸出1KHz的方波','輸出1KHz的正弦波','輸出1KHz的三角波','輸出1KHz的階梯波'],
      correctIndex:0,
      explanation:'示波器面板上的 CAL 校正端子通常會輸出一個已知頻率、已知幅度的方波(常見為 1KHz),用來校正探棒補償。'
    },
    { id:'q18', groupLabel:GROUP, image:false,
      question:'CD Title是指?',
      options:['有資料之光碟片','DVD光碟機','CD ROM光碟機','空白光碟片'],
      correctIndex:0,
      explanation:'CD Title 泛指已經燒錄好內容(遊戲、音樂、軟體等)的光碟片,相對於還沒寫入資料的空白片。'
    },
    { id:'q19', groupLabel:GROUP, image:false,
      question:'Windows 7刪除的檔案,暫存放在下列哪一項?',
      options:['資源回收筒','檔案總管','我的公事包','我的文件夾'],
      correctIndex:0,
      explanation:'一般刪除(非 Shift+Delete)的檔案會先移到資源回收筒,清空資源回收筒才會真正刪除。'
    },
    { id:'q20', groupLabel:GROUP, image:false,
      question:'下列何者不是Linux的文書編輯器?',
      options:['vi','ed','edit','emacs'],
      correctIndex:2,
      explanation:'edit 是 DOS/Windows 的文字編輯器指令,vi、ed、emacs 才是 Linux/Unix 常見的文書編輯器。'
    },
    { id:'q21', groupLabel:GROUP, image:false,
      question:'Windows Server 2012 R2 Essentials支援幾個虛擬機器授權?',
      options:['0','1','2','4'],
      correctIndex:1,
      explanation:'依微軟當時公告的授權規則,Essentials 版本僅授權在 1 台虛擬機器上執行(可選擇實體或虛擬其中一種安裝方式)。'
    },
    { id:'q22', groupLabel:GROUP, image:false,
      question:'Windows Server 2012 R2 Datacenter支援幾個虛擬機器授權?',
      options:['2','4','16','無限制'],
      correctIndex:3,
      explanation:'Datacenter 版本的授權規則是同一台實體主機上可執行無限數量的虛擬機器,這也是它跟 Standard 版最大的差異。'
    },
    { id:'q23', groupLabel:GROUP, image:false,
      question:'Windows 7中的整合管理工具為?',
      options:['MMA','MMB','MMC','MMD'],
      correctIndex:2,
      explanation:'MMC(Microsoft Management Console)是 Windows 用來整合各種管理嵌入式管理單元(如電腦管理、群組原則)的主控台框架。'
    },
    { id:'q24', groupLabel:GROUP, image:false,
      question:'Windows 7網路通訊協定預設為?',
      options:['TCP/IP','NetBEUI','IPX/SPX','PPP'],
      correctIndex:0,
      explanation:'現行 Windows 版本(含 Windows 7)網路連線預設安裝並啟用的通訊協定就是 TCP/IP。'
    },

  /* ---------- state ---------- */
  var cur=0;
  var answered=new Array(QUESTIONS.length).fill(-1); /* -1=未作答,否則為選擇的 index */

  var qcard=document.getElementById('qcard');
  var jumpEl=document.getElementById('jump');
  var prevBtn=document.getElementById('prevBtn');
  var nextBtn=document.getElementById('nextBtn');

  document.getElementById('totalNum').textContent=QUESTIONS.length;

  function correctCount(){
    var n=0;
    for(var i=0;i<QUESTIONS.length;i++){ if(answered[i]===QUESTIONS[i].correctIndex) n++; }
    return n;
  }
  function answeredCount(){
    var n=0;
    for(var i=0;i<answered.length;i++){ if(answered[i]!==-1) n++; }
    return n;
  }

  function renderJump(){
    jumpEl.innerHTML=QUESTIONS.map(function(_,i){
      var cls='jbtn'+(i===cur?' cur':'')+(answered[i]!==-1?' done':'');
      return '<button type="button" class="'+cls+'" data-i="'+i+'">'+(i+1)+'</button>';
    }).join('');
  }

  var AUTO_IMG_EXTS=['jpg','jpeg','png','svg','webp'];
  function imageHtml(q){
    if(q.image===false) return ''; /* 明確標記此題沒有圖 */
    if(q.image) return '<div class="qimg">'+q.image+'</div>'; /* 手動指定(內嵌 SVG 或自己寫的 <img>) */
    return '<div class="qimg"><img data-auto-id="'+esc(q.id)+'" alt=""></div>'; /* 依題號自動嘗試載入 */
  }
  function bindAutoImages(root){
    root.querySelectorAll('.qimg img[data-auto-id]').forEach(function(img){
      var id=img.getAttribute('data-auto-id');
      var exts=AUTO_IMG_EXTS.slice();
      function tryNext(){
        if(!exts.length){ var wrap=img.closest('.qimg'); if(wrap) wrap.remove(); return; }
        img.src='images/'+id+'.'+exts.shift();
      }
      img.addEventListener('error',tryNext);
      tryNext();
    });
  }

  /* 選項可以是純文字字串,也可以是 {img,alt} 圖片選項(例如三視圖辨識這種題目) */
  function optionContent(opt){
    if(opt && typeof opt==='object'){
      return '<img src="'+esc(opt.img)+'" alt="'+esc(opt.alt||'')+'">';
    }
    return '<span>'+esc(opt)+'</span>';
  }
  function optionLabel(opt,i){
    if(opt && typeof opt==='object') return '選項 '+(i+1)+'(如圖)';
    return esc(opt);
  }

  function renderQuestion(){
    var q=QUESTIONS[cur];
    var picked=answered[cur];
    var isAnswered=picked!==-1;
    var imgHtml=imageHtml(q);
    var optsHtml=q.options.map(function(opt,i){
      var cls='opt';
      if(isAnswered){
        if(i===q.correctIndex) cls+=' correct';
        else if(i===picked) cls+=' wrong';
      }
      return '<button type="button" class="'+cls+'" data-i="'+i+'"><span class="num">'+(i+1)+'</span>'+optionContent(opt)+'</button>';
    }).join('');
    var explainHtml=isAnswered?('<div class="explain show">'+(picked===q.correctIndex?'✅ 答對了!':'❌ 答錯了,正確答案是「'+optionLabel(q.options[q.correctIndex],q.correctIndex)+'」。')+'<br><b>詳解:</b>'+q.explanation+'</div>'):'<div class="explain"></div>';

    qcard.className='qcard'+(isAnswered?' answered':'');
    qcard.innerHTML=
      '<div class="grouplabel">'+esc(q.groupLabel)+'　第 '+esc(q.id.replace('q',''))+' 題</div>'+
      '<div class="qbody"><p class="qtext">'+esc(q.question)+'</p>'+imgHtml+'</div>'+
      '<div class="opts">'+optsHtml+'</div>'+
      explainHtml;

    qcard.querySelectorAll('.opt').forEach(function(btn){
      btn.addEventListener('click',function(){
        selectOption(cur,+btn.getAttribute('data-i'));
      });
    });
    bindAutoImages(qcard);

    document.getElementById('curNum').textContent=cur+1;
    document.getElementById('correctNum').textContent=correctCount();
    document.getElementById('progressBar').style.width=(answeredCount()/QUESTIONS.length*100)+'%';
    prevBtn.disabled=(cur===0);
    nextBtn.disabled=(cur===QUESTIONS.length-1);
    renderJump();
  }

  function selectOption(qi,oi){
    if(answered[qi]!==-1) return; /* 已作答過就不能再改,維持第一次作答的結果 */
    answered[qi]=oi;
    if(qi===cur) renderQuestion();
    else renderJump();
  }

  function goTo(i){
    if(i<0||i>=QUESTIONS.length) return;
    cur=i;
    renderQuestion();
    qcard.scrollIntoView({block:'nearest',behavior:'smooth'});
  }

  prevBtn.addEventListener('click',function(){ goTo(cur-1); });
  nextBtn.addEventListener('click',function(){ goTo(cur+1); });
  jumpEl.addEventListener('click',function(e){
    var b=e.target.closest('.jbtn');
    if(!b) return;
    goTo(+b.getAttribute('data-i'));
  });

  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); goTo(cur+1); }
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); goTo(cur-1); }
    else if(e.key>='1'&&e.key<='9'){
      var idx=+e.key-1;
      if(idx<QUESTIONS[cur].options.length){ selectOption(cur,idx); }
    }
  });

  renderQuestion();
})();
</script>
