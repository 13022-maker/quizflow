CAL」（Calibration）端子輸出 1KHz 的 ","after":" 波。（一個字）","segments":["示波器面板的「CAL」（Calibration）端子輸出 1KHz 的 "," 波。（一個字）"],"answers":["方"],"answer":"方","explanation":"CAL 校正端子輸出已知頻率、已知幅度的方波（常見為 1KHz），用來校正探棒補償。"},{"groupLabel":"工作項目01：電腦、電子及電機機械識圖","before":"CD Title 是指 ","after":" 之光碟片。（三個字）","segments":["CD Title 是指 "," 之光碟片。（三個字）"],"answers":["有資料"],"answer":"有資料","explanation":"CD Title 泛指已燒錄好內容（遊戲、音樂、軟體等）的光碟片，相對於空白片。"},{"groupLabel":"工作項目01：電腦、電子及電機機械識圖","before":"Windows 7 刪除的檔案，暫存放在 ","after":"。","segments":["Windows 7 刪除的檔案，暫存放在 ","。"],"answers":["資源回收筒"],"answer":"資源回收筒","explanation":"一般刪除（非 Shift+Delete）的檔案會先移到資源回收筒，清空後才真正刪除。"},{"groupLabel":"工作項目01：電腦、電子及電機機械識圖","before":"vi、ed、edit、emacs 中，不是 Linux 文書編輯器的是 ","after":"。","segments":["vi、ed、edit、emacs 中，不是 Linux 文書編輯器的是 ","。"],"answers":["edit"],"answer":"edit","explanation":"edit 是 DOS／Windows 的文字編輯器指令；vi、ed、emacs 才是 Linux／Unix 常見的編輯器。"},{"groupLabel":"工作項目01：電腦、電子及電機機械識圖","before":"Windows Server 2012 R2 Essentials 支援 ","after":" 個虛擬機器授權。（填阿拉伯數字）","segments":["Windows Server 2012 R2 Essentials 支援 "," 個虛擬機器授權。（填阿拉伯數字）"],"answers":["1"],"answer":"1","explanation":"依微軟當時的授權規則，Essentials 版只授權在 1 台虛擬機器上執行。"}];
  var JOINER="／";
  /* 第 1 格沿用原本的 id="blankInput"，第 2 格起為 blankInput1、blankInput2… */
  function blankId(bi){ return bi===0?'blankInput':'blankInput'+bi; }
  var HINT_PENALTY_PERCENT=3;
  var N=QUESTIONS.length;

  /* ---------- 線上分享版：成績送出 + 繳交到 Google Classroom（共用片段） ---------- */
  function qfSubmitEndpoint(){
    try{ var c=window.__QF_PRACTICE__; return (c&&typeof c.submitEndpoint==='string')?c.submitEndpoint:''; }catch(e){ return ''; }
  }
  function qfUuid(){
    try{ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});
  }
  /* 送出逾時（毫秒）：教室 Wi-Fi / App 內建瀏覽器偶爾整個請求卡住不回應，沒有逾時的話按鈕會永遠停在「送出中…」。
     逾時後讓學生可以重送；server 以 sessionId 冪等，萬一第一次其實已寫入，重送會拿回同一筆結果 */
  function qfSubmitTimeoutMs(){
    try{ var c=window.__QF_PRACTICE__; var t=c&&Number(c.submitTimeoutMs); if(t>0) return t; }catch(e){}
    return 20000;
  }
  /* 把元素捲進畫面（手機上送出結果常在畫面外，學生會以為當掉） */
  function qfReveal(el){
    if(!el||!el.scrollIntoView) return;
    try{ el.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){ try{ el.scrollIntoView(); }catch(e2){} }
  }
  /* 頁面上「看得到」的送出成功訊息（不在 hidden 容器裡）；找不到代表頁面自己的結果畫面沒畫出來 */
  function qfVisibleOk(){
    try{
      var list=document.querySelectorAll('.qf-ok');
      for(var i=0;i<list.length;i++){ if(!list[i].closest('[hidden]')) return list[i]; }
    }catch(e){}
    return null;
  }
  /* 備援面板：頁面自己的結果畫面出錯或學生已離開結束畫面時，仍保證看得到成績與 Classroom 繳交按鈕（不用 alert，避免被 App 內建瀏覽器擋掉） */
  function qfShowFallback(innerHtml){
    try{
      var old=document.getElementById('qfFallbackResult');
      if(old&&old.parentNode) old.parentNode.removeChild(old);
      var box=document.createElement('div');
      box.id='qfFallbackResult';
      box.setAttribute('role','alert');
      box.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;max-width:460px;margin:0 auto;max-height:80vh;overflow-y:auto;background:#fff;border:2px solid #1e8e3e;border-radius:14px;padding:16px 18px;box-shadow:0 8px 28px rgba(15,37,64,.25);font-size:14px;color:#0f2540';
      box.innerHTML=innerHtml+'<div style="text-align:center;margin-top:12px"><button type="button" id="qfFallbackClose" style="font:inherit;padding:8px 18px;border-radius:8px;border:1.5px solid #b9d3e8;background:#fff;color:#0f2540;cursor:pointer">關閉</button></div>';
      document.body.appendChild(box);
      var close=document.getElementById('qfFallbackClose');
      if(close) close.addEventListener('click',function(){ if(box.parentNode) box.parentNode.removeChild(box); });
    }catch(e){}
  }
  function qfFallbackResultHtml(data){
    return '<div style="font-weight:800;color:#15803d;text-align:center">✅ 已送出成績給老師（'+esc(data&&data.score)+' / '+esc(data&&data.maxScore)+' 分）</div>'+qfClassroomHtml(data);
  }
  /* cb(錯誤訊息字串或 null, server 回傳資料)；保證 cb 只呼叫一次。
     成功後一定看得到結果：頁面自己畫的結果在畫面外就捲過去；沒畫出來（cb 丟例外、已離開結束畫面）就顯示備援面板 */
  function qfSubmit(payload,cb){
    var done=false, timer=null, ctrl=null;
    function finish(err,data){
      if(done) return;
      done=true;
      if(timer){ try{ clearTimeout(timer); }catch(e){} }
      var threw=false;
      try{ cb(err,data); }catch(e){ threw=true; }
      if(err){
        if(threw) qfShowFallback('<div style="color:#c62828;font-weight:700;text-align:center">'+esc(err)+'</div>');
        return;
      }
      var ok=threw?null:qfVisibleOk();
      if(!ok){ qfShowFallback(qfFallbackResultHtml(data)); return; }
      if(!ok.closest('.overlay')) qfReveal(ok.parentNode||ok);
    }
    /* 選擇題結束畫面在送出時會重繪，先把「送出中…」帶回畫面裡 */
    qfReveal(document.getElementById('submitScoreBtn'));
    var ep=qfSubmitEndpoint();
    if(!ep||!window.fetch){ finish('目前無法送出，請確認網路連線後再試'); return; }
    try{
      try{ if(window.AbortController) ctrl=new AbortController(); }catch(e){ ctrl=null; }
      timer=setTimeout(function(){
        try{ if(ctrl) ctrl.abort(); }catch(e){}
        finish('送出逾時（網路太慢或連線中斷），請確認網路後再按一次送出');
      },qfSubmitTimeoutMs());
      var opts={method:'POST',body:JSON.stringify(payload),credentials:'omit',headers:{'Content-Type':'text/plain;charset=UTF-8'}};
      if(ctrl) opts.signal=ctrl.signal;
      fetch(ep,opts)
        .then(function(r){
          return r.json().catch(function(){ return null; }).then(function(d){ return {ok:r.ok,data:d}; });
        })
        .then(function(res){
          if(res.ok&&res.data&&res.data.ok){ finish(null,res.data); return; }
          var msg=(res.data&&typeof res.data.error==='string'&&res.data.error)?res.data.error:'送出失敗，請稍後再試';
          finish(msg);
        },function(){ finish('網路連線失敗，請檢查網路後再按一次送出'); })
        .catch(function(){});
    }catch(e){ finish('送出失敗，請稍後再試'); }
  }
  /* 送出成功後的 Classroom 分享按鈕：只接受 Classroom 網域，防止被竄改成任意網址 */
  function qfClassroomHtml(data){
    var href=String((data&&data.classroomShareUrl)||'');

    if(href.indexOf('https://classroom.google.com/')!==0) return '';

        ?'<div class="qf-link">成績連結：<a href="'+esc(resultUrl)+'" target="_blank" rel="noopener">'+esc(resultUrl)+'</a></div>'
        :'')+

  }

  /* 每題基礎配分：Math.floor(100/N)，最後一題補足餘數到 100（比照 QuizFlow 平均配分慣例） */
  function baseScore(i){
    var base=Math.floor(100/N);
    return i===N-1 ? 100-base*(N-1) : base;
  }

  function blankScore(i){
    if(!state[i].checked || !state[i].correct) return 0;
    var penalty=Math.min(1, HINT_PENALTY_PERCENT/100*state[i].hintUses);
    return baseScore(i)*(1-penalty);
  }

  function totalScore(){
    var sum=0;
    for(var i=0;i<N;i++){ sum+=blankScore(i); }
    return Math.round(sum);
  }

  function submitBlockReason(){

          if(bi===0) return esc(seg);
          var label=q.answers.length>1?' aria-label="第 '+bi+' 格" placeholder="('+bi+')"':'';
          return '<input type="text" class="'+inputCls+'" id="'+blankId(bi-1)+'" data-bi="'+(bi-1)+'"'+label+' autocomplete="off" autocorrect="off" spellcheck="false" '+(disabled?'disabled':'')+' value="'+esc(s.typed[bi-1]||'')+'">'+esc(seg);
        }).join('')+
        '</div>'+
        '<div class="pastewarn" id="pasteWarn">請自行輸入答案，這裡不能貼上喔</div>'+
        '<div class="actions">'+
          '<button type="button" class="btn primary" id="checkBtn" '+(disabled?'disabled':'')+'>核對答案</button>'+
          '<button type="button" class="btn warn" id="hintBtn" '+(submitted?'disabled':'')+'>👀 看答案（扣 '+HINT_PENALTY_PERCENT+'%）</button>'+
        '</div>'+
        '<div class="feedback '+(s.checked?(s.correct?'ok show':'err show'):'')+'" id="feedback">'+
          (s.checked ? (s.correct?'✅ 答對了！':'❌ 還不對，再試一次') : '')+
        '</div>'+
        '<div class="hintbox" id="hintBox"></div>'+
        (q.explanation ? '<div class="explain" id="explainBox"><b>詳解：</b>'+esc(q.explanation)+'</div>' : '')+
      '</div>';

    q.answers.forEach(function(_,bi){
      var input=document.getElementById(blankId(bi));
      input.addEventListener('paste', function(e){
        e.preventDefault();
        var warn=document.getElementById('pasteWarn');
        warn.className='pastewarn show';
        setTimeout(function(){ warn.className='pastewarn'; },2000);
      });
      input.addEventListener('drop', function(e){ e.preventDefault(); });
      input.addEventListener('input', function(){ state[cur].typed[bi]=input.value; });
      input.addEventListener('keydown', function(e){
        if(e.key!=='Enter') return;
        e.preventDefault();
        /* 多格題：還有下一格就跳下一格，最後一格才核對 */
        var next=document.getElementById(blankId(bi+1));
        if(next){ next.focus(); } else { document.getElementById('checkBtn').click(); }
      });
    });

    document.getElementById('checkBtn').addEventListener('click', doCheck);
    document.getElementById('hintBtn').addEventListener('click', doHint);

    if(s.hintUses>0){
      var hintBox=document.getElementById('hintBox');
      hintBox.className='hintbox show';
      hintBox.textContent='正確答案是「'+q.answers.join('」「')+'」，已看答案 '+s.hintUses+' 次，這題扣 '+Math.min(100,HINT_PENALTY_PERCENT*s.hintUses)+'% 分數';
    }
    if(s.checked){
      var explainBox=document.getElementById('explainBox');
      if(explainBox) explainBox.className='explain show';
    }

    document.getElementById('checkedNum').textContent=checkedCount();
    document.getElementById('progressBar').style.width=(checkedCount()/N*100)+'%';
    prevBtn.disabled=(cur===0);
    nextBtn.disabled=(cur===N-1);
    /* 條件不足時不再 disabled（disabled 按鈕按了完全沒反應），改成半透明＋按下去說明原因 */
    submitBtn.disabled=submitted;
    var notReady=submitBlockReason();
    submitBtn.className='btn primary'+(notReady?' notready':'');
    if(!notReady||submitted) document.getElementById('submitHint').textContent='';
    renderJump();
  }

  function doCheck(){
    if(submitted) return;
    var q=QUESTIONS[cur];
    var parts=q.answers.map(function(_,bi){
      var input=document.getElementById(blankId(bi));
      return ((input&&input.value)||'').trim();
    });
    state[cur].typed=parts;
    /* 送給 server 的內容 = 各格用 JOINER 串起來，server 以整串比對 answer（同一個 JOINER 串的正解） */
    state[cur].checkedTyped=parts.join(JOINER);
    state[cur].checked=true;
    state[cur].correct=parts.every(function(p,bi){ return p!==''&&p.toLowerCase()===q.answers[bi].trim().toLowerCase(); });
    renderQuestion();
  }

  function doHint(){
    if(submitted) return;
    state[cur].hintUses++;
    renderQuestion();
  }

  function goTo(i){
    if(i<0||i>=N) return;
    cur=i;
    renderQuestion();
  }

  prevBtn.addEventListener('click',function(){ goTo(cur-1); });
  nextBtn.addEventListener('click',function(){ goTo(cur+1); });
  jumpEl.addEventListener('click',function(e){
    var b=e.target.closest('.jbtn');
    if(!b) return;
    goTo(+b.getAttribute('data-i'));
  });

  /* ---------- 送出 ---------- */
  var confirmOverlay=document.getElementById('confirmOverlay');
  var resultOverlay=document.getElementById('resultOverlay');

  submitBtn.addEventListener('click', function(){
    if(submitted) return;
    var reason=submitBlockReason();
    var hint=document.getElementById('submitHint');
    if(reason){
      hint.textContent=reason;
      if(!studentInfoFilled()){ try{ (classInput.value.trim()?nameInput:classInput).focus(); }catch(e){} }
      return;
    }
    hint.textContent='';
    confirmOverlay.hidden=false;
  });
  var confirmOkBtn=document.getElementById('confirmOkBtn');
  var confirmCancelBtn=document.getElementById('confirmCancelBtn');
  var confirmErr=document.getElementById('confirmErr');
  confirmCancelBtn.addEventListener('click', function(){
    if(sending) return;
    confirmErr.textContent='';
    confirmOverlay.hidden=true;
  });
  confirmOkBtn.addEventListener('click', function(){
    if(submitted||sending) return;
    if(!ONLINE_SUBMIT){ finalizeSubmit(null); return; }
    /* 線上分享版：先送到 server，成功才鎖定；失敗留在確認視窗顯示錯誤，可以再按一次 */
    sending=true;
    confirmErr.textContent='';
    confirmOkBtn.disabled=true;
    confirmCancelBtn.disabled=true;
    confirmOkBtn.textContent='送出中…';
    qfSubmit({
      sessionId:SID,
      className:classInput.value.trim(),
      studentName:nameInput.value.trim(),
      answers:state.map(function(s){ return { typed:s.checkedTyped, hintUses:s.hintUses }; })
    }, function(err,data){
      sending=false;
      confirmOkBtn.disabled=false;
      confirmCancelBtn.disabled=false;
      confirmOkBtn.textContent='確定送出';
      if(err){ confirmErr.textContent=err; return; }
      finalizeSubmit(data);
    });
  });

  function finalizeSubmit(serverResult){
    submitted=true;
    classInput.disabled=true;
    nameInput.disabled=true;
    confirmOverlay.hidden=true;
    showResult(serverResult);
    renderQuestion();
  }
  document.getElementById('resultCloseBtn').addEventListener('click', function(){
    resultOverlay.hidden=true;
  });

  function showResult(serverResult){
    document.getElementById('resultStudentInfo').textContent=classInput.value.trim()+'　'+nameInput.value.trim();
    /* 線上版以 server 重算的分數為準（老師端看到的就是這個分數） */
    document.getElementById('finalScore').textContent=serverResult?serverResult.score:totalScore();
    document.getElementById('submitStatus').innerHTML=serverResult
      ?'<div class="qf-ok" style="margin-top:12px">✅ 已送出成績給老師</div>'+qfClassroomHtml(serverResult)
      :'';
    document.getElementById('resultList').innerHTML=QUESTIONS.map(function(q,i){
      var ok=state[i].correct;
      return '<div class="result-item"><span>'+(ok?'✅':'❌')+' 第 '+(i+1)+' 題：'+esc(q.answer)+'</span><span class="result-score">'+blankScore(i).toFixed(1)+' 分</span></div>';
    }).join('');
    resultOverlay.hidden=false;
  }

  renderQuestion();
})();
</script>
</body>
</html>
