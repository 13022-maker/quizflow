<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表單填寫練習 | QuizFlow</title>
<style>
  :root{
    --ink:#0f2540; --blue:#1e5a8a; --blue-dark:#17466b;
    --blue-soft:#dceaf5; --blue-line:#b9d3e8; --paper:#f4f7fb; --card:#fff;
    --ok:#15803d; --ok-soft:#e7f6ec; --err:#c62828; --err-soft:#fdecec;
    --muted:#5a6b7d; --hint:#8091a1; --radius:10px;
    --shadow:0 1px 2px rgba(15,37,64,.06),0 8px 24px rgba(15,37,64,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(1200px 400px at 100% -10%,rgba(30,90,138,.10),transparent 60%),var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:24px 18px 120px}
  [hidden]{display:none!important}

  .hub-head{background:linear-gradient(180deg,var(--blue),var(--blue-dark));color:#fff;border-radius:16px;padding:30px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hub-head::after{content:"";position:absolute;right:-50px;top:-50px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
  .hub-head .kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.85}
  .hub-head h1{margin:8px 0 6px;font-size:27px;font-weight:800}
  .hub-head p{margin:0;opacity:.92;font-size:14px;max-width:52ch}
  .modebar{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap;position:relative;z-index:2}
  .seg{display:inline-flex;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:3px}
  .seg button{border:none;background:transparent;color:#fff;font-weight:700;font-size:13.5px;padding:7px 16px;border-radius:99px;cursor:pointer;font-family:inherit;opacity:.85}
  .seg button.active{background:#fff;color:var(--blue-dark);opacity:1;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .seg.light{background:#eef4fa;border:1px solid var(--blue-line)}
  .seg.light button{color:var(--blue-dark);opacity:.7}
  .seg.light button.active{background:var(--blue);color:#fff;opacity:1}
  .toolbtns{margin-left:auto;display:flex;gap:8px}
  .lb-link{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:700;font-size:13.5px;padding:7px 14px;border-radius:99px;cursor:pointer;font-family:inherit}
  .lb-link:hover{background:rgba(255,255,255,.26)}
  .mode-desc{margin:10px 0 0;font-size:13.5px;opacity:.92;position:relative;z-index:2}
  .conn-line{margin:8px 0 0;font-size:12.5px;opacity:.9;position:relative;z-index:2}
  .cards{margin-top:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .xcard{text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--blue-line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s,border-color .15s;font-family:inherit}
  .xcard:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(15,37,64,.14);border-color:var(--blue)}
  .xtop{display:flex;align-items:center;gap:10px}
  .xnum{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
  .xicon{font-size:24px}
  .xtitle{font-size:16px;font-weight:800}
  .xen{font-size:11.5px;color:var(--muted);font-weight:600}
  .xdesc{font-size:13px;color:var(--muted);flex:1}
  .xtags{display:flex;flex-wrap:wrap;gap:6px}
  .xtags span{font-size:11px;font-weight:700;color:var(--blue-dark);background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:99px;padding:2px 9px}
  .xgo{align-self:flex-end;font-size:13px;font-weight:800;color:var(--blue)}
  .hub-foot{margin-top:22px;text-align:center;font-size:12px;color:var(--hint)}

  .masthead{background:linear-gradient(180deg,var(--blue),var(--blue-dark));color:#fff;border-radius:14px;padding:18px 22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .masthead::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
  .back{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:12px;font-family:inherit;position:relative;z-index:2}
  .back:hover{background:rgba(255,255,255,.26)}
  .masthead .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:700}
  .masthead h1{margin:6px 0 4px;font-size:22px;font-weight:800}
  .masthead .en{opacity:.9;font-size:13px;font-weight:500}
  .note{margin-top:14px;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--blue-dark);display:flex;gap:10px;align-items:flex-start;position:relative;z-index:2}
  .note b{color:var(--ink)}

  .dock{position:sticky;top:0;z-index:30;margin:0 -18px;padding:10px 18px;background:rgba(244,247,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--blue-line)}
  .dock-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .bar{flex:1;height:9px;border-radius:99px;background:#e3ebf3;overflow:hidden}
  .bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f8fd6,var(--ok));transition:width .35s ease}
  .count{font-size:13px;font-weight:700;color:var(--blue-dark);white-space:nowrap}
  .count b{color:var(--ok);font-size:15px}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--blue-dark);background:#fff;border:1.5px solid var(--blue-line);border-radius:99px;padding:3px 12px;white-space:nowrap}
  .timer::before{content:"\23F1 "}
  .timer.warn{color:var(--err);border-color:#f0b4b4;background:#fff3f3}

  form{margin-top:18px}
  .card{background:var(--card);border:1px solid var(--blue-line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .card-head{background:var(--blue-soft);border-bottom:1px solid var(--blue-line);padding:10px 16px;font-weight:700;color:var(--blue-dark);font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--blue-line)}
  .field{background:var(--card);padding:14px 16px}
  .field.full{grid-column:1 / -1}
  label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px;color:var(--ink)}
  label .en{font-weight:500;color:var(--muted);font-size:12px}
  .req{color:var(--err);margin-right:2px}
  input[type=text],input[type=email],input[type=password],select,textarea{width:100%;padding:9px 11px;font-size:14px;color:var(--ink);border:1.5px solid #cbd8e6;border-radius:var(--radius);background:#fff;transition:border-color .15s,box-shadow .15s;font-family:inherit}
  textarea{resize:vertical;min-height:88px;line-height:1.6}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,90,138,.15)}
  input::placeholder,textarea::placeholder{color:#a9b7c6}
  input:disabled,select:disabled,textarea:disabled{background:#f1f4f8;color:#9aa8b6}
  .field.valid input,.field.valid select,.field.valid textarea{border-color:var(--ok)}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--err);background:var(--err-soft)}
  .hintline{font-size:11.5px;color:var(--hint);margin-top:5px}
  .counter{font-weight:700;color:var(--blue-dark)}
  .counter.ok{color:var(--ok)}
  .msg{font-size:12px;margin-top:5px;min-height:16px;display:flex;align-items:center;gap:5px}
  .field.valid .msg{color:var(--ok)}
  .field.invalid .msg{color:var(--err)}
  .msg .ic{font-weight:800}
  .radios{display:flex;gap:18px;padding-top:4px;flex-wrap:wrap}
  .radios label{display:flex;align-items:center;gap:6px;font-weight:600;cursor:pointer;margin:0}
  .radios input{width:16px;height:16px;accent-color:var(--blue)}
  .pwlist{margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px}
  .pwlist li{list-style:none;font-size:11.5px;color:var(--hint);display:flex;align-items:center;gap:6px}
  .pwlist li .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #c3cfdb;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff;transition:.15s}
  .pwlist li.done{color:var(--ok)}
  .pwlist li.done .dot{background:var(--ok);border-color:var(--ok)}

  .actions{position:sticky;bottom:0;margin-top:20px;padding:14px 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border:1px solid var(--blue-line);border-radius:14px;box-shadow:0 -6px 20px rgba(15,37,64,.06);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{border:none;border-radius:var(--radius);font-weight:800;font-size:15px;padding:11px 22px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn.primary{background:linear-gradient(180deg,var(--blue),var(--blue-dark));color:#fff;box-shadow:0 4px 12px rgba(30,90,138,.3)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.sub{background:#eef4fa;color:var(--blue-dark);border:1.5px solid var(--blue-line)}
  .btn.sub:hover{background:var(--blue-soft)}
  .btn.danger{background:var(--err-soft);color:var(--err);border:1.5px solid #f0b4b4}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .spacer{flex:1}
  .status-text{font-size:13.5px;font-weight:700;color:var(--muted)}
  .result{margin-top:16px;border-radius:14px;padding:16px 18px;display:none;font-size:14px;box-shadow:var(--shadow)}
  .result.show{display:block;animation:pop .3s ease}
  .result.pass{background:var(--ok-soft);border:1.5px solid var(--ok);color:var(--ok)}
  .result.fail{background:var(--err-soft);border:1.5px solid var(--err);color:var(--err)}
  .result.wait{background:#fff8e6;border:1.5px solid #e6c65b;color:#8a6d1a}
  .result h3{margin:0 0 8px;font-size:16px}
  .result .sub{font-size:13px;opacity:.9;margin-top:4px}
  .result ul{margin:6px 0 0;padding-left:20px}
  .result li{margin:2px 0}
  .result a{color:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
  .lb-actions{margin-top:12px;display:flex;gap:18px;flex-wrap:wrap}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

  .intro{margin-top:18px;background:var(--card);border:1px solid var(--blue-line);border-radius:14px;box-shadow:var(--shadow);padding:22px}
  .intro h3{margin:0 0 4px;font-size:17px}
  .best{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:12px 16px;margin:16px 0}
  .best h4{margin:0 0 8px;font-size:13px;color:var(--blue-dark)}
  .best ol{margin:0;padding-left:22px}
  .best li{font-size:14px;margin:3px 0}
  .best .empty{font-size:13px;color:var(--hint)}
  .rules{background:#fff;border:1px solid var(--blue-line);border-radius:12px;padding:14px 16px;margin:16px 0}
  .rules h4{margin:0 0 8px;font-size:13px;color:var(--blue-dark)}
  .rules-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
  .rules-row .lbl{font-size:13px;font-weight:700;color:var(--muted);min-width:78px}
  .intro label{display:block;font-weight:700;font-size:14px;margin:4px 0 6px}
  .intro input[type=text]{width:100%;max-width:380px}
  .intro-msg{color:var(--err);font-size:12.5px;min-height:16px;margin:6px 0}
  .intro .link{display:inline-block;margin-left:14px;color:var(--blue);font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:underline}

  .lb-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .lb-tabs button{border:1.5px solid var(--blue-line);background:#fff;color:var(--blue-dark);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:99px;cursor:pointer;font-family:inherit}
  .lb-tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .lb-mode{margin-top:12px;font-size:12.5px;font-weight:700;color:var(--blue-dark)}
  .lb-mode.err{color:var(--err)}
  .lb-body{margin-top:10px;background:var(--card);border:1px solid var(--blue-line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .lb-row{display:grid;grid-template-columns:56px 1fr auto auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid #eef2f7;font-size:14px}
  .lb-row:last-child{border-bottom:none}
  .lb-row.head{background:var(--blue-soft);font-weight:700;color:var(--blue-dark);font-size:12.5px}
  .lb-rank{font-weight:800;font-size:15px}
  .lb-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-time{font-variant-numeric:tabular-nums;font-weight:800;color:var(--blue-dark)}
  .lb-date{font-size:12px;color:var(--hint)}
  .lb-empty{padding:30px 16px;text-align:center;color:var(--hint)}
  .lb-tools{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
  .lb-tools .btn{font-size:13.5px;padding:9px 16px}
  .csvbox{margin-top:12px}
  .csvbox textarea{width:100%;height:120px;font-family:monospace;font-size:12px;resize:vertical}
  .set-msg{font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
  .set-msg.ok{color:var(--ok)}
  .set-msg.err{color:var(--err)}

  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .field.full,.field{grid-column:auto}
    .pwlist{grid-template-columns:1fr}
    .cards{grid-template-columns:1fr}
    .hub-head h1{font-size:22px}
    .masthead h1{font-size:19px}
    .toolbtns{margin-left:0;width:100%}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="hub">
    <header class="hub-head">
      <div class="kick">中文輸入 · 表單填寫練習</div>
      <h1>僑生表單填寫練習</h1>
      <p>模擬台灣校園與生活中常見的各種表單,練習中文輸入與格式規則。可切換「練習模式」或「計時挑戰」;挑戰可設倒數限時與答錯罰時,成績即時彙整到班級排行榜。</p>
      <div class="modebar">
        <div class="seg" id="seg">
          <button data-mode="practice" class="active">🎓 練習模式</button>
          <button data-mode="challenge">🏆 計時挑戰</button>
        </div>
        <div class="toolbtns">
          <button class="lb-link" id="openBoard">🏆 排行榜</button>
        </div>
      </div>
      <p class="mode-desc" id="modeDesc">慢慢練習,即時檢查對錯,沒有時間壓力。</p>
      <p class="conn-line" id="connLine"></p>
    </header>
    <div class="cards" id="cards"></div>
    <div class="hub-foot">共 6 份練習 · 由 QuizFlow 提供 · 挑戰成績即時彙整到班級排行榜</div>
  </div>
  <div id="stage" hidden></div>
</div>

<script>
(function(){
  "use strict";
  function esc(s){return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function parseDate(s){var m=/^(\d{4})\/(\d{2})\/(\d{2})$/.exec((''+s).trim());if(!m)return null;var y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;var dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;return dt;}
  function today(){var t=new Date();t.setHours(0,0,0,0);return t;}
  function cjkCount(v){return (('' +v).match(/[\u4e00-\u9fff]/g)||[]).length;}
  function fmt(ms){if(ms<0)ms=0;var s=Math.round(ms/100)/10;var m=Math.floor(s/60);var r=s-m*60;var rs=r.toFixed(1);if(r<10)rs='0'+rs;return m+':'+rs;}
  function shortDate(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
  function lsGet(k,def){try{var r=localStorage.getItem(k);return r?JSON.parse(r):def;}catch(e){return def;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  /* local leaderboard (fallback) */
  var Store=(function(){var KEY='form_practice_lb_v1',mem=null;function read(){if(mem)return mem;mem=lsGet(KEY,{});return mem;}function write(d){mem=d;lsSet(KEY,d);}return{all:function(){return read();},add:function(id,r){var d=read();(d[id]=d[id]||[]).push(r);write(d);},clearAll:function(){write({});},clearOne:function(id){var d=read();delete d[id];write(d);}};})();

  /* config + rules */
  var CFG=lsGet('form_practice_cfg_v1',{apiBase:'',classCode:''});
  /* --- QuizFlow 嵌入版:自動從網址帶入班級與 API(同源) --- */
  var EMBED=(function(){
    var qp=new URLSearchParams(location.search);
    var cls=(qp.get('class')||'').trim();
    if(cls){ CFG.classCode=cls; CFG.apiBase=(qp.get('api')||'').trim()||location.origin; try{localStorage.setItem('form_practice_cfg_v1',JSON.stringify(CFG));}catch(e){} }
    return { hideBoard:(qp.get('board')||'').toLowerCase()==='off' };
  })();
  var RULES=lsGet('form_practice_rules_v1',{limitSec:0,penaltySec:0});
  function saveCfg(){lsSet('form_practice_cfg_v1',CFG);}
  function saveRules(){lsSet('form_practice_rules_v1',RULES);}
  function onlineOn(){return !!(CFG.apiBase&&CFG.classCode);}
  function apiURL(p){return CFG.apiBase.replace(/\/+$/,'')+p;}
  async function apiSubmit(exId,rec){
    var res=await fetch(apiURL('/api/practice/score'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({classCode:CFG.classCode,exerciseId:exId,name:rec.name,timeMs:rec.t,rawMs:rec.rawMs,penaltyMs:rec.penaltyMs})});
    if(!res.ok)throw new Error('HTTP '+res.status);return await res.json();
  }
  async function apiBoard(exId){
    var res=await fetch(apiURL('/api/practice/board?classCode='+encodeURIComponent(CFG.classCode)+'&exerciseId='+encodeURIComponent(exId)));
    if(!res.ok)throw new Error('HTTP '+res.status);var j=await res.json();
    return (j.scores||[]).map(function(r){return {name:r.name,t:r.timeMs,ts:r.ts};});
  }
  function localRank(exId,t){var a=Store.all()[exId]||[];return a.filter(function(r){return r.t<t;}).length+1;}
  async function saveScore(exId,rec){
    if(onlineOn()){try{var r=await apiSubmit(exId,rec);return {online:true,rank:r.rank};}catch(e){Store.add(exId,rec);return {online:false,failed:true,rank:localRank(exId,rec.t)};}}
    Store.add(exId,rec);return {online:false,rank:localRank(exId,rec.t)};
  }
  async function getBoard(exId){
    if(onlineOn()){try{var s=await apiBoard(exId);s.sort(function(a,b){return a.t-b.t;});return {rows:s,online:true};}catch(e){var l=(Store.all()[exId]||[]).slice().sort(function(a,b){return a.t-b.t;});return {rows:l,online:false,error:true};}}
    var l2=(Store.all()[exId]||[]).slice().sort(function(a,b){return a.t-b.t;});return {rows:l2,online:false};
  }

  var NOTE='這是模擬真實表單的<b>練習頁</b>,輸入的資料<b>不會送出、不會儲存</b>。綠色代表格式正確,紅色代表需要修正;全部填對後按「確定 Confirm」看結果。';

  var EX_ORDER=['01','02','03','04','05','06'];
  var EX={
    '01':{icon:'🪪',title:'學生個人資料維護',en:'Student Personal Information Maintenance',desc:'帳號、密碼強度、護照與統一證號、日期格式等基本個資填寫。',tags:['格式驗證','日期','證件號碼'],kick:'305 · 基本資料維護',head:'學生個人資料維護　Student personal information maintenance',note:NOTE,fields:[

    '<div class="note"><span>📝</span><div>'+cfg.note+'</div></div></header>'+
    '<div class="dock"><div class="dock-inner"><div class="bar"><span id="progressBar"></span></div>'+
    '<div class="count">已完成 <b id="okCount">0</b> / <span id="totalCount">0</span> 欄</div>'+timer+'</div></div>'+
    '<form id="pf-form" novalidate><div class="card"><div class="card-head">'+esc(cfg.head)+'</div>'+
    '<div class="grid">'+cfg.fields.map(fieldHTML).join('')+'</div></div>'+
    '<div class="result" id="result"></div>'+
    '<div class="actions"><button type="submit" class="btn primary" id="confirmBtn">確定 Confirm</button>'+fill+
    '<button type="button" class="btn sub" id="clearBtn">清除 Clear</button>'+
    '<div class="spacer"></div><div class="status-text" id="statusText">請開始填寫 Start filling in</div></div></form>';
  }

  function setup(root,cfg,opts){
    opts=opts||{};
    var fields=cfg.fields,names=fields.map(function(f){return f.name;}),byName={};
    fields.forEach(function(f){byName[f.name]=f;});
    var q=function(s){return root.querySelector(s);};
    q('#totalCount').textContent=names.length;
    var finished=false,startTs=0,iv=null,timerEl=null,wrong=0;
    var limitMs=(RULES.limitSec||0)*1000, penMs=(RULES.penaltySec||0)*1000;

    function getVal(n){var f=byName[n];if(f.type==='radio'){var g=root.querySelector('input[name="'+n+'"]:checked');return g?g.value:'';}var el=q('#'+n);return el?el.value:'';}
    function allVals(){var o={};names.forEach(function(n){o[n]=getVal(n);});return o;}
    function updateCounter(f){if(f.type!=='textarea'||!f.min)return;var span=root.querySelector('.counter[data-for="'+f.name+'"]');if(!span)return;var c=cjkCount(getVal(f.name));span.textContent='目前 '+c+' / 至少 '+f.min+' 字';span.classList.toggle('ok',c>=f.min);}
    function updatePw(f){if(!f.checklist)return;var v=getVal(f.name);var r={len:v.length>=8,alpha:/[A-Za-z]/.test(v),num:/[0-9]/.test(v),sym:/[^A-Za-z0-9]/.test(v)};root.querySelectorAll('.pwlist[data-for="'+f.name+'"] li').forEach(function(li){li.classList.toggle('done',!!r[li.getAttribute('data-rule')]);});}
    function checkField(n,force){var f=byName[n],wrap=root.querySelector('.field[data-name="'+n+'"]'),msg=wrap.querySelector('.msg');var v=getVal(n),err=f.validate(v,allVals());if(!v&&!force){wrap.classList.remove('valid','invalid');msg.textContent='';return false;}if(err){wrap.classList.add('invalid');wrap.classList.remove('valid');msg.innerHTML='<span class="ic">✕</span>'+esc(err);return false;}wrap.classList.add('valid');wrap.classList.remove('invalid');msg.innerHTML='<span class="ic">✓</span>正確 OK';return true;}
    function penHint(){if(!penMs||!opts.challenge)return'';return wrong>0?(' · 答錯 '+wrong+' 次,罰時 +'+(wrong*RULES.penaltySec)+'s'):'';}
    function refresh(){var vals=allVals(),ok=0;names.forEach(function(n){if(byName[n].validate(vals[n],vals)==='')ok++;});q('#okCount').textContent=ok;q('#progressBar').style.width=(ok/names.length*100)+'%';var st=q('#statusText');st.textContent=(ok===0?'請開始填寫 Start filling in':ok<names.length?('還差 '+(names.length-ok)+' 欄'):'全部完成,可以按確定 ✅')+penHint();return ok;}

    fields.forEach(function(f){
      if(f.type==='radio'){root.querySelectorAll('input[name="'+f.name+'"]').forEach(function(r){r.addEventListener('change',function(){checkField(f.name,true);refresh();});});return;}
      var el=q('#'+f.name);
      el.addEventListener('input',function(){updatePw(f);updateCounter(f);checkField(f.name,false);names.forEach(function(n){if(byName[n].dependsOn===f.name){var w=root.querySelector('.field[data-name="'+n+'"]');if(w.classList.contains('valid')||w.classList.contains('invalid'))checkField(n,true);}});refresh();});
      el.addEventListener('blur',function(){checkField(f.name,true);refresh();});
    });

    function lockForm(){root.querySelectorAll('#pf-form input,#pf-form select,#pf-form textarea,#pf-form .btn').forEach(function(x){x.disabled=true;});}
    function timeUp(){
      finished=true;if(iv)clearInterval(iv);if(timerEl){timerEl.textContent='0:00.0';timerEl.classList.add('warn');}
      var box=q('#result');box.className='result fail show';
      box.innerHTML='<h3>⏰ 時間到!未在時限內完成</h3><div class="sub">這次成績不列入排行榜,休息一下再挑戰一次吧!</div>'+
        '<div class="lb-actions"><a data-act="retry">🔁 再挑戰一次</a><a data-act="hub">← 返回選單</a></div>';
      box.querySelector('[data-act="retry"]').addEventListener('click',function(){showChallengeIntro(opts.id);});
      box.querySelector('[data-act="hub"]').addEventListener('click',showHub);
      lockForm();box.scrollIntoView({block:'nearest'});
    }

    async function finishChallenge(){
      finished=true;if(iv)clearInterval(iv);
      var raw=Date.now()-startTs, penalty=wrong*penMs, final=raw+penalty;
      if(timerEl)timerEl.textContent=fmt(limitMs>0?Math.max(0,limitMs-raw):raw);
      var before=Store.all()[opts.id]||[],prevBest=Infinity;
      before.forEach(function(r){if(r.name===opts.name&&r.t<prevBest)prevBest=r.t;});
      var rec={name:opts.name,t:final,rawMs:raw,penaltyMs:penalty,ts:Date.now()};
      var box=q('#result');box.className='result wait show';box.innerHTML='<h3>⏳ 完成!正在'+(onlineOn()?'上傳到班級排行榜':'記錄成績')+'…</h3>';
      var res=await saveScore(opts.id,rec);
      var medal=['','🥇','🥈','🥉'][res.rank]||'';
      var pbLine=(!onlineOn())?(final<prevBest?(prevBest===Infinity?' ｜ 首次完成 ✨':' ｜ 🎉 個人新紀錄!'):(' ｜ 個人最佳 '+fmt(prevBest))):'';
      var breakdown=penalty>0?('<div class="sub">計時 '+fmt(raw)+' ＋ 罰時 '+(wrong*RULES.penaltySec)+'s(答錯 '+wrong+' 次) ＝ 總成績 <b>'+fmt(final)+'</b></div>'):'';
      var netLine=onlineOn()?(res.failed?'<div class="sub">⚠️ 連線失敗,成績已暫存本機。</div>':'<div class="sub">🌐 已上傳到班級「'+esc(CFG.classCode)+'」共用排行榜。</div>'):'';
      box.className='result pass show';
      box.innerHTML='<h3>✅ 完成!總成績 '+fmt(final)+'</h3>'+
        '<div class="sub">'+esc(opts.name)+' ｜ 排名第 <b>'+res.rank+'</b> 名 '+medal+pbLine+'</div>'+breakdown+netLine+
        '<div class="lb-actions"><a data-act="board">🏆 查看排行榜</a><a data-act="retry">🔁 再挑戰一次</a><a data-act="hub">← 返回選單</a></div>';
      box.querySelector('[data-act="board"]').addEventListener('click',function(){showLeaderboard(opts.id);});
      box.querySelector('[data-act="retry"]').addEventListener('click',function(){showChallengeIntro(opts.id);});
      box.querySelector('[data-act="hub"]').addEventListener('click',showHub);
      lockForm();box.scrollIntoView({block:'nearest'});
    }

    q('#pf-form').addEventListener('submit',function(e){
      e.preventDefault();if(finished)return;
      var bad=[];names.forEach(function(n){if(!checkField(n,true))bad.push(n);});refresh();
      var box=q('#result');
      if(bad.length===0){
        if(opts.challenge){finishChallenge();return;}
        box.className='result pass show';box.innerHTML='<h3>✅ 全部正確!格式檢查通過</h3><div class="sub">做得很好!在真實系統中,此時就會送出資料。這裡是練習頁,不會實際送出。</div>';
      }else{
        if(opts.challenge){wrong++;refresh();}
        var lis=bad.map(function(n){return '<li><a data-jump="'+n+'">'+esc(byName[n].zh)+'</a> — '+esc(byName[n].validate(getVal(n),allVals()))+'</li>';}).join('');
        var penNote=(opts.challenge&&penMs)?'<div class="sub">本次答錯,罰時 +'+RULES.penaltySec+'s(目前累計 +'+(wrong*RULES.penaltySec)+'s)</div>':'';
        box.className='result fail show';box.innerHTML='<h3>⚠️ 還有 '+bad.length+' 個欄位需要修正</h3>'+penNote+'<ul>'+lis+'</ul>';
        box.querySelectorAll('[data-jump]').forEach(function(a){a.addEventListener('click',function(){var n=a.getAttribute('data-jump');var t=q('#'+n)||root.querySelector('.field[data-name="'+n+'"]');t.scrollIntoView({block:'center'});if(t.focus)t.focus();});});
      }
      box.scrollIntoView({block:'nearest'});
    });

    var fb=q('#fillBtn');
    if(fb)fb.addEventListener('click',function(){fields.forEach(function(f){if(f.example===undefined)return;if(f.type==='radio'){var r=root.querySelector('input[name="'+f.name+'"][value="'+f.example+'"]');if(r)r.checked=true;}else{var el=q('#'+f.name);if(el)el.value=f.example;}});fields.forEach(function(f){updatePw(f);updateCounter(f);});names.forEach(function(n){checkField(n,true);});refresh();q('#result').className='result';});
    q('#clearBtn').addEventListener('click',function(){if(finished)return;q('#pf-form').reset();root.querySelectorAll('.field').forEach(function(w){w.classList.remove('valid','invalid');w.querySelector('.msg').textContent='';});fields.forEach(function(f){updatePw(f);updateCounter(f);});q('#result').className='result';refresh();});

    fields.forEach(function(f){updatePw(f);updateCounter(f);});refresh();

    if(opts.challenge){
      timerEl=q('#timer');startTs=Date.now();
      iv=setInterval(function(){
        if(finished)return;var el=Date.now()-startTs;
        if(limitMs>0){var rem=limitMs-el;if(rem<=0){timeUp();return;}timerEl.textContent=fmt(rem);timerEl.classList.toggle('warn',rem<30000);}
        else{timerEl.textContent=fmt(el);}
      },100);
    }
  }

  /* ---------- navigation / screens ---------- */

  function exportCSV(){
    var box=document.getElementById('csvbox');if(box)box.innerHTML='<div class="hintline">整理成績中…</div>';
    (async function(){
      var rows=[['題目','姓名','秒數','用時','日期時間']],any=false;
      for(var i=0;i<EX_ORDER.length;i++){var id=EX_ORDER[i];var d=await getBoard(id);d.rows.forEach(function(r){any=true;rows.push([EX[id].title,r.name,(r.t/1000).toFixed(1),fmt(r.t),new Date(r.ts).toLocaleString()]);});}
      if(!any){if(box)box.innerHTML='<div class="hintline">目前沒有任何成績可以匯出。</div>';return;}
      var csv='\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+(''+c).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
      var ok=false;try{var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='班級挑戰成績.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},200);ok=true;}catch(e){ok=false;}
      if(box)box.innerHTML='<div class="hintline" style="margin-bottom:6px">'+(ok?'已嘗試下載 CSV 檔。':'')+'若沒有自動下載,可全選下方文字複製貼到 Excel / Google 試算表:</div><textarea readonly>'+esc(csv)+'</textarea>';
    })();
  }

    document.getElementById('testBtn').addEventListener('click',function(){var base=(document.getElementById('apiBase').value||'').trim(),code=(document.getElementById('classCode').value||'').trim();var m=document.getElementById('setMsg');if(!base||!code){m.className='set-msg err';m.textContent='請先填寫 API 網址與班級代碼。';return;}m.className='set-msg';m.textContent='測試中…';fetch(base.replace(/\/+$/,'')+'/api/practice/board?classCode='+encodeURIComponent(code)+'&exerciseId=01').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){m.className='set-msg ok';m.textContent='✅ 連線成功!目前這題有 '+((j.scores||[]).length)+' 筆成績。';}).catch(function(e){m.className='set-msg err';m.textContent='❌ 連線失敗:'+e.message+'。請確認網址、CORS 與端點是否正確。';});});
    document.getElementById('clrBtn').addEventListener('click',function(){CFG.apiBase='';CFG.classCode='';saveCfg();document.getElementById('apiBase').value='';document.getElementById('classCode').value='';var m=document.getElementById('setMsg');m.className='set-msg ok';m.textContent='已清除,改用本機模式。';updateConnLine();});
    document.title='連線設定';
  }

  function showHub(){clearPoll();stage.hidden=true;stage.innerHTML='';hub.hidden=false;window.scrollTo(0,0);updateConnLine();document.title='僑生表單填寫練習 · 班級計時挑戰';}

  function updateConnLine(){var el=document.getElementById('connLine');if(!el)return;el.innerHTML=onlineOn()?('🌐 班級 <b>'+esc(CFG.classCode)+'</b> · 挑戰成績即時共用':'💾 本機模式 · 成績僅存這台電腦(老師請用含 ?class=班級 的連結開啟以啟用共用)');}

  function renderCards(){
    document.getElementById('cards').innerHTML=EX_ORDER.map(function(id){var c=EX[id];var cta=mode==='challenge'?'開始挑戰 ▶':'開始作答 →';return '<button class="xcard" data-ex="'+id+'"><div class="xtop"><div class="xnum">'+id+'</div><div class="xicon">'+c.icon+'</div></div><div class="xtitle">'+esc(c.title)+'</div><div class="xen">'+esc(c.en)+'</div><div class="xdesc">'+esc(c.desc)+'</div><div class="xtags">'+c.tags.map(function(t){return '<span>'+esc(t)+'</span>';}).join('')+'</div><div class="xgo">'+cta+'</div></button>';}).join('');
    document.querySelectorAll('.xcard').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-ex');mode==='challenge'?showChallengeIntro(id):buildForm(id,{});});});
  }
  document.querySelectorAll('#seg button').forEach(function(b){b.addEventListener('click',function(){mode=b.getAttribute('data-mode');document.querySelectorAll('#seg button').forEach(function(x){x.classList.toggle('active',x===b);});document.getElementById('modeDesc').textContent=mode==='challenge'?'輸入姓名後開始計時,完成後成績會記錄到班級排行榜!':'慢慢練習,即時檢查對錯,沒有時間壓力。';renderCards();});});
  var boardBtn=document.getElementById('openBoard');
  if(EMBED.hideBoard){boardBtn.style.display='none';}
  else{boardBtn.addEventListener('click',function(){showLeaderboard('01');});}
  renderCards();updateConnLine();
})();
</script>
</body>
</html>
